name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    name: API (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm install
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build

  web:
    name: Advertiser Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/advertiser-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/advertiser-web/package-lock.json
      - run: npm install
      - run: npm run build

  docker:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
